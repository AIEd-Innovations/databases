[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aied-db"
version = "0.1.0"
description = "Shared MongoDB layer for the CSU-AIEIC Agentic Design Lab Framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Vishal Murali Kannan" }]
dependencies = ["pymongo>=4.6", "certifi"]

[project.optional-dependencies]
# pymongo and certifi (CA bundle for Atlas TLS) are the runtime dependencies. mongomock stands in for a server;
# pydantic is needed only by tests/test_parity.py, which imports ui-student's
# own stores to compare against — importing its package pulls in pydantic.
dev = ["pytest>=8.0", "mongomock>=4.1", "pydantic>=2.0"]

[tool.setuptools.packages.find]
include = ["aied_db*"]

[tool.setuptools.package-data]
aied_db = ["defaults.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
